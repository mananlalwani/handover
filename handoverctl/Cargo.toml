[package]
name = "handoverctl"
version = "0.3.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command-line client for Handover"

[dependencies]
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
handover-core.workspace = true
handover-ipc.workspace = true
tokio.workspace = true
thiserror.workspace = true
url.workspace = true

[lib]
name = "handoverctl"
path = "src/lib.rs"

[[bin]]
name = "handoverctl"
path = "src/main.rs"

[[bin]]
name = "handoverctl-gen"
path = "src/bin/handoverctl-gen.rs"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
