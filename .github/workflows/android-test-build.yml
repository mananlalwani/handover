name: Signed Android test build

on:
  push:
    branches: [dev]
    paths:
      - 'android/**'
      - '.github/workflows/android-test-build.yml'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'APK version code, greater than the installed version'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set test APK version code
        env:
          TEST_VERSION_CODE: ${{ inputs.version_code }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path('app/build.gradle.kts')
          source = path.read_text()
          current = re.search(r'versionCode = ([0-9]+)', source)
          if current is None:
              raise SystemExit('Source version code not found')
          value = os.environ['TEST_VERSION_CODE'] or str(int(current.group(1)) + int(os.environ['BUILD_NUMBER']))
          if not re.fullmatch(r'[1-9][0-9]{0,9}', value) or int(value) > 2100000000:
              raise SystemExit('Invalid version code')
          if int(value) <= int(current.group(1)):
              raise SystemExit('Test version code must exceed the source version code')
          source, count = re.subn(r'versionCode = [0-9]+', f'versionCode = {value}', source)
          if count != 1:
              raise SystemExit('Expected one version code')
          path.write_text(source)
          PY
      - name: Restore release signing key
        env:
          HANDOVER_ANDROID_KEYSTORE_B64: ${{ secrets.HANDOVER_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$HANDOVER_ANDROID_KEYSTORE_B64"
          umask 077
          printf '%s' "$HANDOVER_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/handover-release.jks"
          echo "HANDOVER_ANDROID_SIGNING_FILE=$RUNNER_TEMP/handover-release.jks" >> "$GITHUB_ENV"
      - name: Build and check signed APK
        env:
          HANDOVER_ANDROID_STORE_PASSWORD: ${{ secrets.HANDOVER_ANDROID_STORE_PASSWORD }}
          HANDOVER_ANDROID_KEY_ALIAS: ${{ secrets.HANDOVER_ANDROID_KEY_ALIAS }}
          HANDOVER_ANDROID_KEY_PASSWORD: ${{ secrets.HANDOVER_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$HANDOVER_ANDROID_STORE_PASSWORD"
          test -n "$HANDOVER_ANDROID_KEY_ALIAS"
          test -n "$HANDOVER_ANDROID_KEY_PASSWORD"
          ./gradlew :app:assembleRelease :app:lintRelease :app:testDebugUnitTest
      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: handover-android-signed-test-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/handover-release.jks"
