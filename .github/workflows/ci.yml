name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew assembleDebug lintDebug testDebugUnitTest

  quickshell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - run: nix profile install nixpkgs#quickshell nixpkgs#qt6Packages.qtdeclarative
      - name: Lint Quickshell files
        run: |
          quickshell_qml="$(nix eval --raw nixpkgs#quickshell)/lib/qt-6/qml"
          qt_qml="$(nix eval --raw nixpkgs#qt6Packages.qtdeclarative)/lib/qt-6/qml"
          qmllint -I "$quickshell_qml" -I "$qt_qml" \
            quickshell/HandoverService.qml quickshell/example.qml
