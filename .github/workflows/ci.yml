name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'crates/handover-native/**'
              - 'handoverd/src/ipc_server/**'
              - '.github/workflows/ci.yml'

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install GTK development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-4-dev libadwaita-1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build -p handover-gmessages --features loopback-test --bin handover-gmessages-helper
      - name: Install desktop integration test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dbus-daemon playerctl gnome-keyring xvfb ffmpeg heif-gdk-pixbuf webp-pixbuf-loader libgtk-4-media-gstreamer gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - run: cargo test --workspace
      - name: Test credentials against a private GNOME Keyring service
        run: python3 scripts/test-secret-service.py
      - name: Test native messaging app on a private display
        run: python3 scripts/test-handover-messages.py
      - name: Test tarball installer and upgrades without changing user services
        run: python3 scripts/test-install-from-dist.py
      - run: cargo test --locked --manifest-path third_party/ukey2/Cargo.toml -p ukey2_rs --features test_rustcrypto

  rust-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: Install GTK development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-4-dev libadwaita-1-dev
      - run: cargo check --locked --workspace --all-targets

  linux-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-24.04-release
      - name: Install package build and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake pkg-config libssl-dev libgtk-4-dev libadwaita-1-dev dbus-user-session iproute2
      - run: ./scripts/dist.sh
      - name: Fetch the fixed upgrade baseline
        run: |
          curl --fail --location --silent --show-error --retry 2 \
            https://github.com/mananlalwani/handover/releases/download/v0.4.0/handover-0.4.0-x86_64-unknown-linux-gnu.tar.gz \
            -o "$RUNNER_TEMP/handover-0.4.0.tar.gz"
          printf '%s  %s\n' d0417e43b3d106e21595879cc399486fb0c97acfaf95f7691bbb82fcfb99aa50 \
            "$RUNNER_TEMP/handover-0.4.0.tar.gz" | sha256sum --check -
      - name: Validate package files and real installed services
        run: |
          for archive in dist/*.tar.gz; do
            python3 scripts/test-install-from-dist.py --archive "$archive" \
              --previous-archive "$RUNNER_TEMP/handover-0.4.0.tar.gz"
            sudo python3 scripts/test-package-runtime.py --disposable-environment \
              --archive "$archive" --previous-archive "$RUNNER_TEMP/handover-0.4.0.tar.gz"
          done

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug lintDebug testDebugUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache emulator AVD
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-x86_64-pixel_2
      - name: Run Android framework-boundary tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          script: cd android && ./gradlew connectedDebugAndroidTest

  quickshell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - run: nix profile install nixpkgs#quickshell nixpkgs#qt6Packages.qtdeclarative
      - name: Lint Quickshell files
        run: |
          command -v quickshell
          command -v qmllint
          quickshell_qml="$(nix eval --raw nixpkgs#quickshell)/lib/qt-6/qml"
          qt_qml="$(nix eval --raw nixpkgs#qt6Packages.qtdeclarative)/lib/qt-6/qml"
          test -f "$quickshell_qml/Quickshell/qmldir"
          qmllint -I "$quickshell_qml" -I "$qt_qml" \
            quickshell/IpcRequest.qml quickshell/HandoverService.qml quickshell/example.qml quickshell/send.qml quickshell/pages/*.qml quickshell/components/*.qml
      - name: Check desktop launcher
        run: sh scripts/test-handover-gui.sh
      - name: Test desktop sharing without a phone
        run: |
          node --test quickshell/tests/*.test.mjs
          python3 scripts/test-handover-send.py
