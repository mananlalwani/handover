name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew assembleDebug lintDebug testDebugUnitTest

  quickshell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo add-apt-repository --yes ppa:avengemedia/danklinux
      - run: sudo apt-get update
      - run: sudo apt-get install --yes qt6-declarative-dev-tools quickshell
      - run: >-
          qmllint
          -I /usr/lib/qt6/qml
          -I /usr/lib/x86_64-linux-gnu/qt6/qml
          quickshell/HandoverService.qml quickshell/example.qml
