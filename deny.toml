# cargo-deny configuration for Handover.
# This is an MIT licensed repository. Copyleft licenses are denied here.
# Validated against cargo-deny 0.20.

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# These standalone crates moved into zbus 6. secret-service 5.2 still requires
# zbus 5; remove these maintenance exceptions when it supports zbus 6.
# Security vulnerability advisories remain enforced.
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "zvariant remains required by secret-service 5.2 through zbus 5; migrate when secret-service supports zbus 6" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names remains required by secret-service 5.2 through zbus 5; migrate when secret-service supports zbus 6" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive remains required by secret-service 5.2 through zbus 5; migrate when secret-service supports zbus 6" },
]

[licenses]
# Anything not listed here is denied, which keeps copyleft, unlicensed,
# and other licenses out of this MIT repository.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  # foldhash 0.2, via rusqlite's hashbrown, is zlib. Permissive, not copyleft.
  "Zlib",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
