# cargo-deny configuration for Handover.
# This is an MIT licensed repository. Copyleft licenses are denied here.
# Validated against cargo-deny 0.20.

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
# Anything not listed here is denied, which keeps copyleft, unlicensed,
# and other licenses out of this MIT repository.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
