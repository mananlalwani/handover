[package]
name = "handover-google-messages"
version = "0.4.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "handover-google-messages-auth-probe"
path = "src/bin/auth_probe.rs"

[[bin]]
name = "handover-google-messages-helper"
path = "src/bin/helper.rs"

[dependencies]
base64 = "0.22.1"
handover-core.workspace = true
handover-gmessages.workspace = true
handover-ipc.workspace = true
prost = "0.14.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
uuid = { version = "1.23", features = ["v4"] }
ukey2_rs = { version = "0.1.0", path = "../../third_party/ukey2/connections/ukey2/ukey2" }
crypto_provider_rustcrypto = { version = "0.1.0", path = "../../third_party/ukey2/crypto/crypto_provider_rustcrypto" }
rand = { version = "0.8.5", features = ["std_rng"] }
zeroize = "1.8.1"
hkdf = "0.12.4"
sha2 = "0.10.9"
libc.workspace = true
tempfile.workspace = true
aes = { version = "0.8.4", features = ["zeroize"] }
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
ctr = "0.9.2"
hmac = "0.12.1"

secret-service = { version = "4.0.0", default-features = false, features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
ukey2_proto = { version = "0.1.0", path = "../../third_party/ukey2/connections/ukey2/ukey2_proto" }
